[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "factgate"
version = "0.1.0"
description = "Fact-verification gate for LLM claims backed by RCK (relational compositional knowledge)."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
authors = [
    { name = "Kristian Baer / Northtek" },
]
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
dependencies = [
    "numpy>=1.24",
    "pydantic>=2.0",
]

[project.urls]
Homepage = "https://github.com/NORTHTEKDevs/factgate"
RCK = "https://github.com/NORTHTEKDevs/rck"

# rck is not on PyPI. Install it separately as an editable local
# package before running factgate, e.g.:
#   pip install -e ../rck
# See README.md.

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

[tool.setuptools.packages.find]
include = ["factgate*"]
